<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Al Firas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;padding-bottom:100px;color:#111}
button,input,textarea,select{font:inherit}
#tabs{display:flex;flex-wrap:wrap;background:#111;color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#tabs button{flex:1;min-width:110px;padding:14px 10px;background:none;border:0;color:#fff;cursor:pointer}
#tabs button.on{background:#333;border-bottom:3px solid #fff}
#tabs #logoutBtn{flex:0 0 auto;min-width:80px;background:#c00}
.page{display:none;padding:18px;max-width:1000px;margin:auto}.page.on{display:block}
input,textarea,select{width:100%;padding:10px;margin:5px 0;border:1px solid #d9d9d9;border-radius:8px;background:#fff}
textarea{min-height:100px;resize:vertical}
button.b{padding:10px 16px;border-radius:8px;border:0;background:#111;color:#fff;cursor:pointer}
button.b.secondary{background:#666}
button.b.danger{background:#c00}
button.small{padding:6px 10px;border-radius:7px;border:0;background:#111;color:#fff;cursor:pointer}
.chk{display:inline-flex;align-items:center;gap:5px;margin:3px;border:1px solid #ddd;padding:7px 10px;border-radius:20px;cursor:pointer;background:#fff;font-size:13px;user-select:none}
.chk.on{background:#111;color:#fff;border-color:#111}
.chk input{display:none}
.sectionBox{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin:12px 0}
.fieldTitle{font-weight:700;margin:15px 0 7px}
.help{font-size:12px;color:#777;margin-top:2px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}.card .in{padding:9px}
#detail{display:none;background:#fff;border-radius:12px;padding:16px;margin-bottom:80px}
#detail img{width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:10px;background:#f9f9f9}
.nchip{display:inline-flex;align-items:center;background:#eee;padding:6px 10px;border-radius:20px;margin:4px;font-size:13px}
.nx{background:#c00;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;margin-left:6px;cursor:pointer}
#sug,#charSug,#occSug{border:1px solid #ddd;border-radius:8px;background:#fff;max-height:160px;overflow-y:auto;display:none}
#sug div,#charSug div,#occSug div{padding:8px;cursor:pointer}#sug div:hover,#charSug div:hover,#occSug div:hover{background:#f0f0f0}
.noteRow{display:flex;justify-content:space-between;gap:12px;background:#fff;padding:10px 12px;margin:7px 0;border-radius:8px;align-items:center;border:1px solid #eee}
.noteRow .actions{white-space:nowrap}
.rev{border-top:1px solid #eee;padding:10px 0}.vtbtn{background:transparent;color:#111;border:1px solid #111;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
#vtPop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
#vtPop .box{background:#fff;padding:20px;border-radius:12px;width:92%;max-width:420px;text-align:center}
#vtLinkText{word-break:break-all;font-size:12px;background:#f5f5f5;padding:8px;border-radius:8px;margin:10px 0}
.dd{position:relative;min-width:155px}.ddBtn{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ddPanel{position:absolute;top:105%;left:0;width:280px;max-height:310px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;flex-direction:column;overflow:hidden;z-index:200}
.ddSearch{margin:8px;padding:8px;border:1px solid #ddd;border-radius:8px}.ddList{overflow-y:auto;padding:0 8px 8px}
.nrow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;cursor:pointer;font-size:14px}.nrow:hover{background:#f5f5f5}.nrow input{width:auto;margin:0}
.nall{border-bottom:1px solid #eee;margin:0 8px;padding:8px 6px;font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer}.nall input{width:auto;margin:0}
.filterBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.filterBar #q{max-width:190px}.filterBar #fBrand{max-width:150px}
.filterBar .dd{min-width:155px;max-width:210px}
.libTabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.libTabs button{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}.libTabs button.on{background:#111;color:#fff}
.libPage{display:none}.libPage.on{display:block}
.tagArea{min-height:42px;border:1px solid #eee;border-radius:8px;padding:5px;background:#fafafa}
@media(max-width:768px){#grid{grid-template-columns:repeat(2,1fr)}.ddPanel{width:230px}.filterBar #q,.filterBar #fBrand{max-width:none;width:100%}.filterBar .dd{max-width:none;width:100%}.page{padding:12px}}
</style>
</head>
<body>
<div id="tabs">
<button class="on" onclick="sw(0)">All Products</button>
<button onclick="sw(1)">Add Products</button>
<button onclick="sw(2)">Library</button>
<button onclick="sw(3)">Links</button>
<button onclick="sw(4)">Banner</button>
<button id="logoutBtn">Logout</button>
</div>

<div class="page on" id="p0">
  <div class="filterBar">
    <input id="q" placeholder="Cari nama parfum...">
    <select id="fBrand"><option value="">Semua Brand</option></select>
    <div class="dd" id="genderDD">
      <button class="ddBtn" id="genderBtn" type="button">Semua Gender ▾</button>
      <div class="ddPanel" id="genderPanel">
        <label class="nall"><input type="checkbox" id="genderAll" checked> Semua Gender</label>
        <div class="ddList" id="genderList">
          <label class="nrow"><input type="checkbox" data-g="pria"> Pria</label>
          <label class="nrow"><input type="checkbox" data-g="wanita"> Wanita</label>
          <label class="nrow"><input type="checkbox" data-g="unisex"> Unisex</label>
        </div>
      </div>
    </div>
    <div class="dd" id="notesDD">
      <button class="ddBtn" id="notesBtn" type="button">Semua Notes ▾</button>
      <div class="ddPanel" id="notesPanel">
        <input class="ddSearch" id="notesSearch" placeholder="Ketik notes...">
        <label class="nall"><input type="checkbox" id="notesAll" checked> Semua Notes</label>
        <div class="ddList" id="notesList"></div>
      </div>
    </div>
    <div class="dd" id="charDD">
      <button class="ddBtn" id="charBtn" type="button">Semua Karakter Aroma ▾</button>
      <div class="ddPanel" id="charPanel">
        <input class="ddSearch" id="charSearch" placeholder="Ketik karakter aroma...">
        <label class="nall"><input type="checkbox" id="charAll" checked> Semua Karakter</label>
        <div class="ddList" id="charList"></div>
      </div>
    </div>
    <div class="dd" id="occDD">
      <button class="ddBtn" id="occBtn" type="button">Semua Cocok Untuk ▾</button>
      <div class="ddPanel" id="occPanel">
        <input class="ddSearch" id="occSearch" placeholder="Ketik penggunaan...">
        <label class="nall"><input type="checkbox" id="occAll" checked> Semua Cocok Untuk</label>
        <div class="ddList" id="occList"></div>
      </div>
    </div>
  </div>
  <div id="listV">
    <div id="grid"></div>
    <div style="text-align:center;margin:18px 12px 70px">
      <button class="b" id="btnMore">Lebih banyak</button>
      <button class="b secondary" id="btnLess" style="display:none">Lebih sedikit</button>
    </div>
  </div>
  <div id="detail"></div>
</div>

<div class="page" id="p1">
  <h3 id="formTitle">Tambah Produk</h3>
  <div class="sectionBox">
    <input id="name" placeholder="Nama *">
    <input id="brand" placeholder="Brand">
    <input id="price" type="number" placeholder="Harga">
    <input id="image" placeholder="URL Gambar">
    <input id="shopee" placeholder="Link Shopee">
    <input id="vtLink" placeholder="Link VT TikTok Review">
    <input id="adminScore" type="number" step="0.1" min="1" max="10" placeholder="Score Admin 1-10">
    <textarea id="desc" placeholder="Deskripsi"></textarea>
  </div>

  <div class="sectionBox">
    <div class="fieldTitle">Gender</div>
    <div id="gBox">
      <label class="chk"><input type="checkbox" value="pria"> pria</label>
      <label class="chk"><input type="checkbox" value="wanita"> wanita</label>
      <label class="chk"><input type="checkbox" value="unisex"> unisex</label>
    </div>

    <div class="fieldTitle">Karakter Aroma</div>
    <div id="selectedCharacters" class="tagArea"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="newCharacter" placeholder="Tambah karakter aroma..." style="flex:1">
      <button class="b" id="addCharacterBtn" style="width:60px">+</button>
    </div>
    <div id="charSug"></div>

    <div class="fieldTitle">Cocok Untuk</div>
    <div id="selectedOccasions" class="tagArea"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="newOccasion" placeholder="Tambah penggunaan/occasion..." style="flex:1">
      <button class="b" id="addOccasionBtn" style="width:60px">+</button>
    </div>
    <div id="occSug"></div>
  </div>

  <div class="sectionBox">
    <div class="fieldTitle">Notes Terpilih</div>
    <div id="selBox" class="tagArea"></div>
    <div class="fieldTitle">Tambah Notes</div>
    <div style="display:flex;gap:8px">
      <input id="newNote" placeholder="Ketik notes..." style="flex:1">
      <button class="b" id="addNoteBtn" style="width:60px">+</button>
    </div>
    <div id="sug"></div>
  </div>

  <button class="b" id="save" style="width:100%;margin-top:4px">Simpan Produk</button>
  <button class="b secondary" id="cancelEdit" style="width:100%;margin-top:8px;display:none">Batal Edit</button>
</div>

<div class="page" id="p2">
  <h3>Library</h3>
  <div class="libTabs">
    <button class="on" data-lib="notes">Notes</button>
    <button data-lib="characters">Karakter Aroma</button>
    <button data-lib="occasions">Cocok Untuk</button>
  </div>
  <div class="libPage on" id="libNotesPage">
    <h4>Library Notes</h4>
    <div style="display:flex;gap:8px"><input id="libInput" placeholder="Ketik + Enter" style="flex:1"><button class="b" id="libAdd">+</button></div>
    <div id="libList" style="margin-top:12px"></div>
  </div>
  <div class="libPage" id="libCharactersPage">
    <h4>Library Karakter Aroma</h4>
    <div style="display:flex;gap:8px"><input id="charLibInput" placeholder="Ketik + Enter" style="flex:1"><button class="b" id="charLibAdd">+</button></div>
    <div id="charLibList" style="margin-top:12px"></div>
  </div>
  <div class="libPage" id="libOccasionsPage">
    <h4>Library Cocok Untuk</h4>
    <div style="display:flex;gap:8px"><input id="occLibInput" placeholder="Ketik + Enter" style="flex:1"><button class="b" id="occLibAdd">+</button></div>
    <div id="occLibList" style="margin-top:12px"></div>
  </div>
</div>

<div class="page" id="p3">
  <h3>Links</h3>
  <label>Link Profil TikTok</label>
  <input id="tiktokProfile" placeholder="https://tiktok.com/@...">
  <button class="b" onclick="saveTiktok()">Simpan</button>
  <hr style="margin:20px 0">
  <h3>Link VT Review TikTok per Produk</h3>
  <div id="vtList" style="margin-top:12px"></div>
</div>

<div class="page" id="p4">
  <h3>Banner</h3>
  <input id="bannerUrl" placeholder="https://...">
  <div style="display:flex;gap:8px"><button class="b" onclick="saveBanner()">Simpan</button><button class="b secondary" onclick="testBanner()">Preview</button></div>
  <div id="bannerPreview" style="margin-top:10px"></div>
</div>

<div id="vtPop"><div class="box"><h3 style="margin:0">Buka VT Review</h3><div id="vtLinkText"></div><div style="display:flex;gap:8px"><button class="b" id="vtOpen" style="flex:1">Buka Link</button><button class="b" id="vtCopy" style="flex:1;background:#333">Copy Link</button></div><button class="b secondary" id="vtClose" style="width:100%;margin-top:8px">Tutup</button></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAdz_Kdu7r_nxFw1LAUJCBCzIZd7aZKnp4",authDomain:"alfiras-parfum.firebaseapp.com",projectId:"alfiras-parfum",storageBucket:"alfiras-parfum.firebasestorage.app",messagingSenderId:"234128042647",appId:"1:234128042647:web:f6c504ba2e5b324aa517d2"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const ALLOWED_ADMIN="firasalkhalid@gmail.com";
let authOK=false;

firebase.auth().onAuthStateChanged(function(user){
  if(!user||user.email!==ALLOWED_ADMIN){if(user)firebase.auth().signOut();location.href='index.html';return;}
  if(authOK)return;authOK=true;initAdmin();
});
document.getElementById('logoutBtn').onclick=()=>firebase.auth().signOut().then(()=>location.href='index.html');

function initAdmin(){
let all=[],showN=25,editId=null,selected=new Set(),selectedCharacters=new Set(),selectedOccasions=new Set();
let libNotes=[],libCharacters=[],libOccasions=[],allNotes=[],allCharacters=[],allOccasions=[];
let selG0=new Set(),selNotes=new Set(),selCharacters=new Set(),selOccasions=new Set(),curVt='';

const esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:[v]);
const lowerArr=v=>arr(v).map(x=>String(x).toLowerCase().trim()).filter(Boolean);
function getCharacters(p){for(const k of ['characters','character','karakterAroma','karakter']){if(p[k]!==undefined&&p[k]!==null){const a=arr(p[k]);if(a.length)return a}}return[];}
function getOccasions(p){for(const k of ['suitableFor','occasion','occasions','cocokUntuk']){if(p[k]!==undefined&&p[k]!==null){const a=arr(p[k]);if(a.length)return a}}return[];}
function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function avg(p){const hasAdmin=Number(p.adminScore||0)>0,c=Number(p.ratingCount||0),s=Number(p.ratingSum||0);if(hasAdmin&&c===0)return Number(p.adminScore).toFixed(1);if(hasAdmin&&c>0)return((Number(p.adminScore)+s)/(1+c)).toFixed(1);if(!hasAdmin&&c>0)return(s/c).toFixed(1);return'-';}

function sw(i){document.querySelectorAll('#tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('on',k===i));window.scrollTo({top:0,behavior:'smooth'});}
window.sw=sw;

function openVt(l){curVt=l;document.getElementById('vtLinkText').textContent=l;document.getElementById('vtPop').style.display='flex';}
window.openVt=openVt;
document.getElementById('vtClose').onclick=()=>document.getElementById('vtPop').style.display='none';
document.getElementById('vtOpen').onclick=()=>{if(curVt)window.open(curVt,'_blank');};
document.getElementById('vtCopy').onclick=async()=>{try{await navigator.clipboard.writeText(curVt);alert('Link tercopy!');}catch(e){const t=document.createElement('textarea');t.value=curVt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Link tercopy!');}};

function setupDropdown(btn,panel,root){btn.onclick=e=>{e.stopPropagation();const open=panel.style.display==='flex';closeDropdowns();if(!open)panel.style.display='flex';};document.addEventListener('click',e=>{if(!root.contains(e.target))panel.style.display='none';});}
function closeDropdowns(){document.querySelectorAll('.ddPanel').forEach(x=>x.style.display='none');}
setupDropdown(document.getElementById('genderBtn'),document.getElementById('genderPanel'),document.getElementById('genderDD'));
setupDropdown(document.getElementById('notesBtn'),document.getElementById('notesPanel'),document.getElementById('notesDD'));
setupDropdown(document.getElementById('charBtn'),document.getElementById('charPanel'),document.getElementById('charDD'));
setupDropdown(document.getElementById('occBtn'),document.getElementById('occPanel'),document.getElementById('occDD'));

function updateLabel(btn,set,empty,one){if(!set.size)btn.textContent=empty+' ▾';else if(set.size===1)btn.textContent=[...set][0]+' ▾';else btn.textContent=set.size+' dipilih ▾';}

const genderAll=document.getElementById('genderAll');
genderAll.onchange=()=>{if(genderAll.checked){selG0.clear();document.querySelectorAll('#genderList input').forEach(x=>x.checked=false);updateLabel(document.getElementById('genderBtn'),selG0,'Semua Gender');renderGrid();}else genderAll.checked=true;};
document.querySelectorAll('#genderList input').forEach(cb=>cb.onchange=()=>{if(cb.checked)selG0.add(cb.dataset.g);else selG0.delete(cb.dataset.g);genderAll.checked=selG0.size===0;updateLabel(document.getElementById('genderBtn'),selG0,'Semua Gender');showN=25;renderGrid();});

function renderDDList(list,selected,listEl,allCb,btn,empty,filter){const f=list.filter(n=>!filter||n.toLowerCase().includes(filter));listEl.innerHTML=f.map(n=>`<label class="nrow"><input type="checkbox" data-v="${escapeHtml(n)}" ${selected.has(n)?'checked':''}> ${escapeHtml(n)}</label>`).join('')||'<div style="padding:8px"><small>Tidak ketemu</small></div>';listEl.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{const v=cb.dataset.v;if(cb.checked)selected.add(v);else selected.delete(v);allCb.checked=selected.size===0;updateLabel(btn,selected,empty);showN=25;renderGrid();});}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}

const notesBtn=document.getElementById('notesBtn'),notesPanel=document.getElementById('notesPanel'),notesSearch=document.getElementById('notesSearch'),notesList=document.getElementById('notesList'),notesAll=document.getElementById('notesAll');
const charBtn=document.getElementById('charBtn'),charSearch=document.getElementById('charSearch'),charList=document.getElementById('charList'),charAll=document.getElementById('charAll');
const occBtn=document.getElementById('occBtn'),occSearch=document.getElementById('occSearch'),occList=document.getElementById('occList'),occAll=document.getElementById('occAll');
notesSearch.oninput=()=>renderDDList(allNotes,selNotes,notesList,notesAll,notesBtn,'Semua Notes',notesSearch.value.toLowerCase().trim());
charSearch.oninput=()=>renderDDList(allCharacters,selCharacters,charList,charAll,charBtn,'Semua Karakter Aroma',charSearch.value.toLowerCase().trim());
occSearch.oninput=()=>renderDDList(allOccasions,selOccasions,occList,occAll,occBtn,'Semua Cocok Untuk',occSearch.value.toLowerCase().trim());
notesAll.onchange=()=>{if(notesAll.checked){selNotes.clear();renderDDList(allNotes,selNotes,notesList,notesAll,notesBtn,'Semua Notes',notesSearch.value.toLowerCase().trim());renderGrid();}else notesAll.checked=true;};
charAll.onchange=()=>{if(charAll.checked){selCharacters.clear();renderDDList(allCharacters,selCharacters,charList,charAll,charBtn,'Semua Karakter Aroma',charSearch.value.toLowerCase().trim());renderGrid();}else charAll.checked=true;};
occAll.onchange=()=>{if(occAll.checked){selOccasions.clear();renderDDList(allOccasions,selOccasions,occList,occAll,occBtn,'Semua Cocok Untuk',occSearch.value.toLowerCase().trim());renderGrid();}else occAll.checked=true;};

async function getLib(name){try{const s=await db.collection(name).get();return s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return[];}}
async function loadLibraries(){libNotes=await getLib('noteLib');libCharacters=await getLib('characterLib');libOccasions=await getLib('occasionLib');allNotes=[...new Set(libNotes.map(x=>x.name).filter(Boolean))].sort();allCharacters=[...new Set(libCharacters.map(x=>x.name).filter(Boolean))].sort();allOccasions=[...new Set(libOccasions.map(x=>x.name).filter(Boolean))].sort();renderDDList(allNotes,selNotes,notesList,notesAll,notesBtn,'Semua Notes',notesSearch.value.toLowerCase().trim());renderDDList(allCharacters,selCharacters,charList,charAll,charBtn,'Semua Karakter Aroma',charSearch.value.toLowerCase().trim());renderDDList(allOccasions,selOccasions,occList,occAll,occBtn,'Semua Cocok Untuk',occSearch.value.toLowerCase().trim());renderAllLibraries();renderAllSelections();}

function renderLibRows(items,box,editFn,delFn,empty){box.innerHTML=items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="noteRow"><span>${escapeHtml(x.name)}</span><span class="actions"><button class="small" onclick="${editFn}('${esc(x.id)}','${esc(x.name)}')">Edit</button> <button class="small danger" onclick="${delFn}('${esc(x.id)}','${esc(x.name)}')">Hapus</button></span></div>`).join('')||`<small>${empty}</small>`;}
function renderAllLibraries(){renderLibRows(libNotes,document.getElementById('libList'),'editNoteLib','delNoteLib','Belum ada notes');renderLibRows(libCharacters,document.getElementById('charLibList'),'editCharacterLib','delCharacterLib','Belum ada karakter aroma');renderLibRows(libOccasions,document.getElementById('occLibList'),'editOccasionLib','delOccasionLib','Belum ada pilihan cocok untuk');}
async function addLibrary(collection,name,after){name=String(name||'').toLowerCase().trim();if(!name)return;if((await db.collection(collection).where('name','==',name).get()).size)return alert('Sudah ada');await db.collection(collection).add({name});await loadLibraries();if(after)after();}
window.editNoteLib=async(id,name)=>{const nv=prompt('Edit:',name);if(nv===null)return;const nn=nv.toLowerCase().trim();if(!nn)return;await db.collection('noteLib').doc(id).update({name:nn});const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const notes=arr(p.notes);if(notes.some(x=>String(x).toLowerCase()===name.toLowerCase()))await db.collection('products').doc(d.id).update({notes:notes.map(x=>String(x).toLowerCase()===name.toLowerCase()?nn:x)});}await loadLibraries();await loadProducts();};
window.delNoteLib=async(id,name)=>{if(!confirm('Yakin hapus '+name+'?'))return;await db.collection('noteLib').doc(id).delete();const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const notes=arr(p.notes).filter(x=>String(x).toLowerCase()!==name.toLowerCase());if(notes.length!==arr(p.notes).length)await db.collection('products').doc(d.id).update({notes});}await loadLibraries();await loadProducts();};
window.editCharacterLib=async(id,name)=>{const nv=prompt('Edit:',name);if(nv===null)return;const nn=nv.toLowerCase().trim();if(!nn)return;await db.collection('characterLib').doc(id).update({name:nn});const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const a=getCharacters(p);if(a.some(x=>String(x).toLowerCase()===name.toLowerCase()))await db.collection('products').doc(d.id).update({characters:a.map(x=>String(x).toLowerCase()===name.toLowerCase()?nn:x)});}await loadLibraries();await loadProducts();};
window.delCharacterLib=async(id,name)=>{if(!confirm('Yakin hapus '+name+'? Produk yang memakai karakter ini akan kehilangan karakter tersebut.'))return;await db.collection('characterLib').doc(id).delete();const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const a=getCharacters(p).filter(x=>String(x).toLowerCase()!==name.toLowerCase());if(a.length!==getCharacters(p).length)await db.collection('products').doc(d.id).update({characters:a});}await loadLibraries();await loadProducts();};
window.editOccasionLib=async(id,name)=>{const nv=prompt('Edit:',name);if(nv===null)return;const nn=nv.toLowerCase().trim();if(!nn)return;await db.collection('occasionLib').doc(id).update({name:nn});const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const a=getOccasions(p);if(a.some(x=>String(x).toLowerCase()===name.toLowerCase()))await db.collection('products').doc(d.id).update({suitableFor:a.map(x=>String(x).toLowerCase()===name.toLowerCase()?nn:x)});}await loadLibraries();await loadProducts();};
window.delOccasionLib=async(id,name)=>{if(!confirm('Yakin hapus '+name+'? Produk yang memakai pilihan ini akan kehilangan pilihan tersebut.'))return;await db.collection('occasionLib').doc(id).delete();const ps=await db.collection('products').get();for(const d of ps.docs){const p=d.data();const a=getOccasions(p).filter(x=>String(x).toLowerCase()!==name.toLowerCase());if(a.length!==getOccasions(p).length)await db.collection('products').doc(d.id).update({suitableFor:a});}await loadLibraries();await loadProducts();};

document.getElementById('libAdd').onclick=()=>{const i=document.getElementById('libInput');addLibrary('noteLib',i.value,()=>i.value='');};
document.getElementById('charLibAdd').onclick=()=>{const i=document.getElementById('charLibInput');addLibrary('characterLib',i.value,()=>i.value='');};
document.getElementById('occLibAdd').onclick=()=>{const i=document.getElementById('occLibInput');addLibrary('occasionLib',i.value,()=>i.value='');};
document.getElementById('libInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('libAdd').click();}};
document.getElementById('charLibInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('charLibAdd').click();}};
document.getElementById('occLibInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('occLibAdd').click();}};

document.querySelectorAll('.libTabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.libTabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.libPage').forEach(x=>x.classList.remove('on'));btn.classList.add('on');const key=btn.dataset.lib;document.getElementById(key==='notes'?'libNotesPage':key==='characters'?'libCharactersPage':'libOccasionsPage').classList.add('on');});

async function loadProducts(){try{const s=await db.collection('products').orderBy('createdAt','desc').get();all=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){try{const s=await db.collection('products').get();all=s.docs.map(d=>({id:d.id,...d.data()}));}catch(err){all=[];}}const br=[...new Set(all.map(p=>p.brand).filter(Boolean))].sort();document.getElementById('fBrand').innerHTML='<option value="">Semua Brand</option>'+br.map(b=>`<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');renderGrid();renderVtList();}
function filtered(){const q=document.getElementById('q').value.toLowerCase().trim(),b=document.getElementById('fBrand').value;return all.filter(p=>{if(q&&!(`${p.name||''} ${p.brand||''}`.toLowerCase().includes(q)))return false;if(b&&p.brand!==b)return false;const gs=lowerArr(p.gender);if(selG0.size&&!gs.some(g=>selG0.has(g)))return false;const ns=lowerArr(p.notes);if(selNotes.size&&!([...selNotes].every(x=>ns.includes(x.toLowerCase()))))return false;const cs=lowerArr(getCharacters(p));if(selCharacters.size&&!([...selCharacters].every(x=>cs.includes(x.toLowerCase()))))return false;const os=lowerArr(getOccasions(p));if(selOccasions.size&&!([...selOccasions].every(x=>os.includes(x.toLowerCase()))))return false;return true;});}
function renderGrid(){document.getElementById('listV').style.display='block';document.getElementById('detail').style.display='none';const f=filtered(),g=document.getElementById('grid');g.innerHTML='';f.slice(0,showN).forEach(p=>{const el=document.createElement('div');el.className='card';const chars=getCharacters(p).slice(0,2).join(', ');el.innerHTML=`<img src="${escapeHtml(p.image||'https://via.placeholder.com/300')}" onerror="this.src='https://via.placeholder.com/300'"><div class="in"><b>${escapeHtml(p.name||'')}</b><br><small>${escapeHtml(p.brand||'')}</small><br>⭐ ${avg(p)}/10 · ${Number(p.ratingCount||0)} ulasan<br>${rp(p.price)}${chars?`<br><small>${escapeHtml(chars)}</small>`:''}</div>`;el.onclick=()=>openDetail(p.id);g.appendChild(el);});document.getElementById('btnMore').style.display=f.length>showN?'':'none';document.getElementById('btnLess').style.display=showN>25?'':'none';}
window.renderGrid=renderGrid;
['q','fBrand'].forEach(id=>document.getElementById(id).oninput=()=>{showN=25;renderGrid();});
document.getElementById('btnMore').onclick=()=>{showN+=25;renderGrid();};document.getElementById('btnLess').onclick=()=>{showN=Math.max(25,showN-25);renderGrid();};

function renderVtList(){const box=document.getElementById('vtList'),list=all.filter(p=>p.vtLink);box.innerHTML=list.map(p=>`<div class="noteRow"><span><b>${escapeHtml(p.brand||'')}</b> - ${escapeHtml(p.name||'')}<br><small style="word-break:break-all">${escapeHtml(p.vtLink)}</small></span><span class="actions"><button class="small" onclick="openVt('${esc(p.vtLink)}')">Buka</button> <button class="small" onclick="editVt('${esc(p.id)}')">Edit</button> <button class="small danger" onclick="delVt('${esc(p.id)}')">Hapus</button></span></div>`).join('')||'<small>Belum ada link VT.</small>';}
window.editVt=async id=>{const cur=(all.find(x=>x.id===id)||{}).vtLink||'';const nv=prompt('Edit link VT:',cur);if(nv===null)return;await db.collection('products').doc(id).update({vtLink:nv.trim()});loadProducts();};
window.delVt=async id=>{if(!confirm('Hapus link VT ini?'))return;await db.collection('products').doc(id).update({vtLink:''});loadProducts();};

function renderTagSet(set,box,removeFn){box.innerHTML=[...set].sort().map(n=>`<span class="nchip">${escapeHtml(n)}<button class="nx" onclick="${removeFn}('${esc(n)}')">x</button></span>`).join('')||'<small style="color:#777">Belum ada</small>';}
function renderAllSelections(){renderSel();renderCharacterSelections();renderOccasionSelections();}
function renderSel(){renderTagSet(selected,document.getElementById('selBox'),'remSel');}
function renderCharacterSelections(){renderTagSet(selectedCharacters,document.getElementById('selectedCharacters'),'remCharacter');}
function renderOccasionSelections(){renderTagSet(selectedOccasions,document.getElementById('selectedOccasions'),'remOccasion');}
window.remSel=n=>{selected.delete(n);renderSel();};
window.remCharacter=n=>{selectedCharacters.delete(n);renderCharacterSelections();};
window.remOccasion=n=>{selectedOccasions.delete(n);renderOccasionSelections();};

document.querySelectorAll('#gBox .chk').forEach(l=>l.addEventListener('click',e=>{e.preventDefault();l.classList.toggle('on');l.querySelector('input').checked=l.classList.contains('on');}));

function doAddToSet(value,set,collection,input,sug,render){value=String(value||'').toLowerCase().trim();if(!value)return;if(set.size>=20)return alert('Maksimal 20 pilihan');if(!set.has(value)){set.add(value);if(!([...(collection==='noteLib'?libNotes:collection==='characterLib'?libCharacters:libOccasions)].some(x=>x.name===value)))db.collection(collection).add({name:value}).then(loadLibraries);}input.value='';sug.style.display='none';render();}
const ni=document.getElementById('newNote'),sug=document.getElementById('sug');
const ci=document.getElementById('newCharacter'),charSug=document.getElementById('charSug');
const oi=document.getElementById('newOccasion'),occSug=document.getElementById('occSug');
document.getElementById('addNoteBtn').onclick=()=>doAddToSet(ni.value,selected,'noteLib',ni,sug,renderSel);
document.getElementById('addCharacterBtn').onclick=()=>doAddToSet(ci.value,selectedCharacters,'characterLib',ci,charSug,renderCharacterSelections);
document.getElementById('addOccasionBtn').onclick=()=>doAddToSet(oi.value,selectedOccasions,'occasionLib',oi,occSug,renderOccasionSelections);
ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addNoteBtn').click();}};
ci.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addCharacterBtn').click();}};
oi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addOccasionBtn').click();}};
function setupSuggest(input,box,items,set,render){input.oninput=()=>{const v=input.value.toLowerCase().trim();if(!v){box.style.display='none';return;}const m=items.map(x=>x.name||x).filter(n=>n.toLowerCase().includes(v)&&!set.has(n)).slice(0,8);if(!m.length){box.style.display='none';return;}box.innerHTML=m.map(n=>`<div data-v="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('');box.style.display='block';box.querySelectorAll('div').forEach(d=>d.onclick=()=>{set.add(d.dataset.v);input.value='';box.style.display='none';render();});};}
setupSuggest(ni,sug,libNotes,selected,renderSel);setupSuggest(ci,charSug,libCharacters,selectedCharacters,renderCharacterSelections);setupSuggest(oi,occSug,libOccasions,selectedOccasions,renderOccasionSelections);

async function openDetail(id){const d=await db.collection('products').doc(id).get();if(!d.exists)return;const p={id:d.id,...d.data()};document.getElementById('listV').style.display='none';const det=document.getElementById('detail');det.style.display='block';const nchips=arr(p.notes).map(n=>`<span class="nchip">${escapeHtml(n)}<button class="nx" onclick="delNote('${esc(id)}','${esc(n)}')">x</button></span>`).join('');const cchips=getCharacters(p).map(n=>`<span class="nchip">${escapeHtml(n)}</span>`).join('');const ochips=getOccasions(p).map(n=>`<span class="nchip">${escapeHtml(n)}</span>`).join('');const rs=await db.collection('products').doc(id).collection('reviews').orderBy('createdAt','desc').get();const revs=rs.docs.map(rd=>{const r=rd.data();const vtb=r.vtLink?` <button class="vtbtn" onclick="openVt('${esc(r.vtLink)}')">Lihat VT Review Ku</button>`:'';return `<div class="rev"><div><b>${escapeHtml(r.name||'')}</b> - ⭐${escapeHtml(r.score)}${vtb}</div><div style="margin-top:4px">${escapeHtml(r.text||'')}</div><button onclick="delRev('${esc(id)}','${esc(rd.id)}')" style="background:#c00;color:#fff;border:0;padding:4px 8px;border-radius:6px;margin-top:6px">Hapus ulasan</button></div>`;}).join('')||'<small>Belum ada ulasan</small>';const prodVt=p.vtLink?`<button class="b" style="margin-top:8px;background:#000" onclick="openVt('${esc(p.vtLink)}')">Test Buka VT Produk</button>`:'';det.innerHTML=`<button class="b" onclick="renderGrid()">← Kembali</button> <button class="b" onclick="startEdit('${esc(id)}')">Edit</button> <button class="b danger" onclick="delP('${esc(id)}')">Delete</button><img src="${escapeHtml(p.image||'https://via.placeholder.com/600')}" style="margin-top:10px" onerror="this.src='https://via.placeholder.com/600'"><h2>${escapeHtml(p.name||'')}</h2><p><b>${escapeHtml(p.brand||'')}</b> • ⭐ ${avg(p)}/10 • ${Number(p.ratingCount||0)} ulasan • ${rp(p.price)}</p><p>${escapeHtml(p.desc||'')}</p><p><b>Gender:</b> ${escapeHtml(arr(p.gender).join(', ')||'-')}</p><p><b>Karakter Aroma:</b><br>${cchips||'<small>belum ada</small>'}</p><p><b>Cocok Untuk:</b><br>${ochips||'<small>belum ada</small>'}</p><p><small>VT: ${escapeHtml(p.vtLink||'-')}</small></p>${prodVt}<h4>Notes</h4><div>${nchips||'<small>belum ada</small>'}</div><h4>Ulasan Pengunjung</h4>${revs}<div style="height:80px"></div>`;window.scrollTo({top:0,behavior:'smooth'});}
window.delNote=async(id,note)=>{const d=await db.collection('products').doc(id).get();const ns=arr(d.data().notes).filter(x=>x!==note);await db.collection('products').doc(id).update({notes:ns});await loadProducts();openDetail(id);};
window.delP=async id=>{if(!confirm('Yakin hapus produk ini?'))return;await db.collection('products').doc(id).delete();await loadProducts();};
window.delRev=async(pid,rid)=>{if(!confirm('Yakin hapus ulasan ini? Ini akan hapus rating + link VT juga.'))return;await db.collection('products').doc(pid).collection('reviews').doc(rid).delete();const rs=await db.collection('products').doc(pid).collection('reviews').get();let sum=0;rs.forEach(d=>sum+=Number(d.data().score||0));await db.collection('products').doc(pid).update({ratingSum:sum,ratingCount:rs.size});await loadProducts();openDetail(pid);};

window.startEdit=async id=>{const d=await db.collection('products').doc(id).get();if(!d.exists)return;const p=d.data();editId=id;['name','brand','price','image','shopee','vtLink','adminScore','desc'].forEach(k=>document.getElementById(k).value=p[k]??'');selected=new Set(lowerArr(p.notes));selectedCharacters=new Set(lowerArr(getCharacters(p)));selectedOccasions=new Set(lowerArr(getOccasions(p)));renderAllSelections();document.querySelectorAll('#gBox .chk').forEach(l=>{const v=l.querySelector('input').value;const on=lowerArr(p.gender).includes(v);l.classList.toggle('on',on);l.querySelector('input').checked=on;});sw(1);document.getElementById('formTitle').innerText='Edit Produk';document.getElementById('save').innerText='Update';document.getElementById('cancelEdit').style.display='block';};
function resetForm(){editId=null;['name','brand','price','image','shopee','vtLink','adminScore','desc'].forEach(k=>document.getElementById(k).value='');selected.clear();selectedCharacters.clear();selectedOccasions.clear();renderAllSelections();document.querySelectorAll('#gBox .chk').forEach(l=>{l.classList.remove('on');l.querySelector('input').checked=false;});document.getElementById('formTitle').innerText='Tambah Produk';document.getElementById('save').innerText='Simpan Produk';document.getElementById('cancelEdit').style.display='none';}
document.getElementById('cancelEdit').onclick=resetForm;

document.getElementById('save').onclick=async()=>{const gs=[...document.querySelectorAll('#gBox input:checked')].map(i=>i.value);const sc=Number(document.getElementById('adminScore').value||0);const name=document.getElementById('name').value.trim();if(!name)return alert('Nama wajib');if(!gs.length)return alert('Gender wajib');const data={name,brand:document.getElementById('brand').value.trim(),price:Number(document.getElementById('price').value||0),image:document.getElementById('image').value.trim(),shopee:document.getElementById('shopee').value.trim(),vtLink:document.getElementById('vtLink').value.trim(),adminScore:sc,desc:document.getElementById('desc').value,notes:[...selected],gender:gs,characters:[...selectedCharacters],suitableFor:[...selectedOccasions]};try{if(editId){await db.collection('products').doc(editId).update(data);alert('Terupdate');}else{data.ratingSum=0;data.ratingCount=0;data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('products').add(data);alert('Tersimpan');}resetForm();await loadLibraries();await loadProducts();sw(0);}catch(e){alert('Gagal menyimpan: '+e.message);}};

window.testBanner=()=>{const u=document.getElementById('bannerUrl').value.trim();document.getElementById('bannerPreview').innerHTML=u?`<img src="${escapeHtml(u)}" style="width:100%;border-radius:8px" onerror="this.alt='Gambar gagal dimuat'">`:'';};
window.saveBanner=async()=>{const u=document.getElementById('bannerUrl').value.trim();await db.collection('settings').doc('site').set({bannerUrl:u},{merge:true});alert('Tersimpan');testBanner();};
window.saveTiktok=async()=>{const u=document.getElementById('tiktokProfile').value.trim();await db.collection('settings').doc('site').set({tiktokProfile:u},{merge:true});alert('Tersimpan');};

(async()=>{try{const d=await db.collection('settings').doc('site').get();if(d.exists){if(d.data().bannerUrl){document.getElementById('bannerUrl').value=d.data().bannerUrl;testBanner();}if(d.data().tiktokProfile)document.getElementById('tiktokProfile').value=d.data().tiktokProfile;}}catch(e){}})();

(async()=>{await loadLibraries();await loadProducts();})();
}
</script>
</body>
</html>
