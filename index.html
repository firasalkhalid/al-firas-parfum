<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Firas Parfum</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#171717;--muted:#777;--line:#e8e8e8;--bg:#f7f7f5;--accent:#b56d22;--shadow:0 8px 28px rgba(0,0,0,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
#freeze{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.07)}
#banner{height:218px;background-size:cover;background-position:center;background-color:#151515;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;text-align:center;padding:20px;overflow:hidden}
#banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.52))}#banner>*{position:relative;z-index:1}
#banner h1{margin:0;font-size:clamp(29px,4vw,42px);letter-spacing:-1px;text-shadow:0 3px 16px rgba(0,0,0,.45)}#banner p{margin:9px 0 0;opacity:.94;font-size:15px}
#adminBtn{position:absolute;top:15px;right:17px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.8);padding:8px 15px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
#tiktokBtn{margin-top:16px;display:inline-block;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;padding:10px 17px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid rgba(255,255,255,.8);font-size:13px}
#filters{background:#fff;padding:11px max(12px,calc((100% - 1200px)/2));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#filters input,#filters select{height:38px;padding:8px 11px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none}#q{flex:1 1 190px;min-width:150px}#fBrand{min-width:150px}
.genderGroup{display:flex;gap:6px}.gchk{border:1px solid #ddd;padding:8px 12px;height:38px;border-radius:999px;cursor:pointer;background:#fff;color:#444;font-size:13px;display:inline-flex;align-items:center}.gchk.on{background:#171717;color:#fff;border-color:#171717}
#notesDD{position:relative;min-width:160px}#notesBtn{width:100%;height:38px;padding:8px 12px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notesPanel{position:absolute;top:calc(100% + 7px);left:0;width:280px;max-height:320px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.15);display:none;flex-direction:column;overflow:hidden;z-index:100}#notesSearch{margin:10px;padding:9px;border:1px solid #ddd;border-radius:9px}#notesList{overflow-y:auto;padding:0 9px 10px}.nrow{display:flex;gap:8px;padding:8px 7px;cursor:pointer;border-radius:7px;font-size:13px}.nrow:hover{background:#f5f5f5}.nall{border-bottom:1px solid #eee;padding:9px 7px;margin:0 9px;font-weight:700;display:flex;gap:8px;cursor:pointer}
#wrap{min-height:calc(100vh - 330px);overflow-y:auto;padding:25px 16px 120px}#listView{max-width:1200px;margin:auto}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:0 0 15px}.sectionHead h2{margin:0;font-size:19px}.sectionHead p{margin:4px 0 0;color:var(--muted);font-size:13px}.resultInfo{color:#888;font-size:12px}
#grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid #ededed;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 3px 13px rgba(0,0,0,.045);transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.1)}.photoWrap{position:relative;background:#f1f1ef;aspect-ratio:1;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;display:block}.ratingBadge{position:absolute;left:9px;bottom:9px;background:rgba(255,255,255,.94);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.card.in{padding:12px}.cardName{font-weight:800;font-size:14px;line-height:1.25}.cardBrand{color:#777;font-size:11px;margin:4px 0 9px}.cardBottom{display:flex;justify-content:space-between;align-items:end;gap:8px}.pr{color:var(--accent);font-weight:800;font-size:13px}.tapHint{color:#aaa;font-size:10px}
#moreBar{text-align:center;padding:24px 0 10px}button.b{background:#171717;color:#fff;border:0;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700}.empty{background:#fff;border:1px dashed #ddd;border-radius:16px;padding:42px 20px;text-align:center;color:#777}
#detail{display:none;background:#fff;border:1px solid #ececec;border-radius:20px;padding:20px;max-width:920px;margin:auto;box-shadow:var(--shadow)}.detailTop{margin-bottom:14px}.backBtn{background:#f3f3f3!important;color:#222!important}.detailHero{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:26px;align-items:start}.detailPhoto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#f6f6f4}.detailInfo h2{margin:2px 0 6px;font-size:30px;letter-spacing:-.7px}.detailBrand{color:#777;font-size:14px;margin-bottom:14px}.detailScore{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f5f5f3;font-weight:800;font-size:13px}.detailPrice{font-size:20px;color:var(--accent);font-weight:850;margin:13px 0}.detailDesc{line-height:1.7;color:#555;font-size:14px;white-space:pre-line}.notesBox{margin:16px 0;padding-top:14px;border-top:1px solid #eee}.notesTitle{text-transform:uppercase;letter-spacing:.8px;color:#888;font-weight:800;font-size:12px;margin-bottom:8px}.noteChip{display:inline-block;background:#f2f2f0;color:#444;padding:6px 9px;border-radius:999px;margin:0 4px 5px 0;font-size:11px}.actionStack{display:grid;gap:8px;margin-top:15px}.buyBtn{background:#111!important}.vtBtn{background:#eee!important;color:#222!important}
.reviewSection{margin-top:28px;padding-top:22px;border-top:1px solid #eee}.reviewSection h3{margin:0 0 4px}.reviewSub{color:#888;font-size:12px;margin-bottom:12px}.rev-group{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}.rev-item{border-top:1px solid #f0f0f0;padding:9px 0;font-size:13px;line-height:1.55}.rev-item:first-child{border-top:0}.vtbtn{background:transparent;border:1px solid #111;padding:4px 9px;border-radius:999px;font-size:11px;cursor:pointer;font-weight:700}
#pop,#vtPop{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:999;padding:15px;backdrop-filter:blur(3px)}#pop .box,#vtPop .box{background:#fff;padding:20px;border-radius:18px;width:92%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}#pop .box input,#pop .box select,#pop .box textarea{width:100%;display:block;margin:7px 0;padding:11px;border:1px solid #ddd;border-radius:10px}#vtLinkText{word-break:break-all;font-size:12px;background:#f5f5f5;padding:10px;border-radius:9px;margin:12px 0}
#loginWrap{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,.58);backdrop-filter:blur(3px);padding:15px}#loginWrap .loginBox{background:#fff;border-radius:18px;max-width:380px;width:92%;padding:24px;text-align:center}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;opacity:0;pointer-events:none;transition:.3s;z-index:99999;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.success{background:#16a34a}.toast.warn{background:#f59e0b}.toast.error{background:#dc2626}
@media(max-width:1050px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){#grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detailHero{grid-template-columns:1fr}.detailInfo h2{font-size:26px}}@media(max-width:600px){#banner{height:190px}#filters{padding:9px 10px}#q{flex-basis:100%}#notesDD{flex:1 1 140px}.genderGroup{flex:1}.gchk{flex:1;justify-content:center}#wrap{padding:18px 10px 100px}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:13px}.card.in{padding:10px}.cardName{font-size:13px}#detail{padding:14px;border-radius:16px}.resultInfo{display:none}}
</style>
</head>
<body>
<div id="freeze">
  <div id="banner">
    <button id="adminBtn">Admin</button>
    <h1>Al Firas Parfum</h1>
    <p>Temukan parfum yang cocok buat kamu.</p>
    <a id="tiktokBtn" href="javascript:void(0)">TikTok Firas ↗</a>
  </div>
  <div id="filters">
    <input id="q" placeholder="🔎  Cari nama parfum...">
    <select id="fBrand"><option value="">Semua Brand</option></select>
    <div class="genderGroup"><span class="gchk" data-v="pria">Pria</span><span class="gchk" data-v="wanita">Wanita</span><span class="gchk" data-v="unisex">Unisex</span></div>
    <div id="notesDD"><button id="notesBtn" type="button">Semua Notes ▾</button><div id="notesPanel"><input id="notesSearch" placeholder="Cari notes..."><label class="nall"><input type="checkbox" id="notesAll" checked> Semua Notes</label><div id="notesList"></div></div></div>
  </div>
</div>
<div id="wrap">
  <div id="listView">
    <div class="sectionHead"><div><h2>Koleksi Parfum</h2><p>Cari berdasarkan nama, brand, gender, atau notes.</p></div><div id="resultInfo" class="resultInfo"></div></div>
    <div id="grid"></div>
    <div id="moreBar"><button class="b" id="btnMore">Lihat lebih banyak</button><button class="b" id="btnLess" style="display:none;background:#666">Lihat lebih sedikit</button></div>
  </div>
  <div id="detail"></div>
</div>
<div id="pop"><div class="box"><h3 style="margin-top:0">Bagikan pengalamanmu</h3><p style="font-size:12px;color:#777">Kasih rating dan ulasan untuk parfum ini.</p><input id="rName" placeholder="Nama *"><input id="rSos" placeholder="TikTok/IG (opsional)"><select id="rScore"><option value="">Score 1-10 *</option></select><input id="rVt" placeholder="Link VT Review Ku (opsional)"><textarea id="rText" placeholder="Ulasan singkat *" rows="4"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="b" id="rSave" style="flex:1">Kirim Review</button><button class="b" id="rBack" style="flex:1;background:#777">Kembali</button></div></div></div>
<div id="vtPop"><div class="box"><h3 style="margin:0">Buka VT Review</h3><div id="vtLinkText"></div><div style="display:flex;gap:8px"><button class="b" id="vtOpen" style="flex:1">Buka Link</button><button class="b" id="vtCopy" style="flex:1;background:#333">Copy Link</button></div><button class="b" id="vtClose" style="width:100%;margin-top:8px;background:#777">Tutup</button></div></div>
<div id="loginWrap"><div class="loginBox"><h3 style="margin-top:0">Login Admin</h3><p style="font-size:12px;color:#777">Masuk untuk mengelola koleksi Al Firas Parfum.</p><button id="loginGoogle" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;font-weight:700">Login dengan Google</button><button id="loginCancel" style="margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:#f1f1f1;cursor:pointer">Batal</button><div id="loginErr" style="color:#c00;font-size:13px;margin-top:10px"></div></div></div>
<div id="toast" class="toast"></div>
<script>
/* =====================================================
   FIREBASE — KONFIGURASI ASLI, TIDAK DIUBAH
===================================================== */
const firebaseConfig={apiKey:"AIzaSyAdz_Kdu7r_nxFw1LAUJCBCzIZd7aZKnp4",authDomain:"alfiras-parfum.firebaseapp.com",projectId:"alfiras-parfum"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let all=[],showN=25,selG=new Set(),rateId=null,revShowGroup=5,allNotes=[],selNotes=new Set(),curVt='';
for(let i=1;i<=10;i++)document.getElementById('rScore').innerHTML+=`<option>${i}</option>`;
function showToast(msg,type='success'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',3500)}
function getVisitorId(){let id=localStorage.getItem('alfiras_visitor');if(!id){id='v_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem('alfiras_visitor',id)}return id}
(function initAdminLogin(){const ALLOWED="firasalkhalid@gmail.com",auth=firebase.auth(),provider=new firebase.auth.GoogleAuthProvider(),btn=document.getElementById('adminBtn'),wrap=document.getElementById('loginWrap'),err=document.getElementById('loginErr');btn.onclick=()=>{const u=auth.currentUser;if(u&&u.email===ALLOWED)location.href='admin.html';else{if(u)auth.signOut();wrap.style.display='flex';err.textContent=''}};document.getElementById('loginCancel').onclick=()=>wrap.style.display='none';document.getElementById('loginGoogle').onclick=async()=>{try{const res=await auth.signInWithPopup(provider);if(res.user.email!==ALLOWED){await auth.signOut();err.textContent='Tidak diizinkan.';return}location.href='admin.html'}catch(e){err.textContent=e.message}}})();
function avg(p){const hasAdmin=p.adminScore>0,c=p.ratingCount||0,s=p.ratingSum||0;if(hasAdmin&&c===0)return Number(p.adminScore).toFixed(1);if(hasAdmin&&c>0)return((Number(p.adminScore)+s)/(1+c)).toFixed(1);if(!hasAdmin&&c>0)return(s/c).toFixed(1);return '-'}
function rp(n){return'Rp '+Number(n||0).toLocaleString('id-ID')}function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}function fmtDate(ts){try{return ts.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}}
document.querySelectorAll('.gchk').forEach(el=>el.onclick=()=>{const v=el.dataset.v;if(selG.has(v)){selG.delete(v);el.classList.remove('on')}else{selG.add(v);el.classList.add('on')}showN=25;render()});
const notesBtn=document.getElementById('notesBtn'),notesPanel=document.getElementById('notesPanel'),notesSearch=document.getElementById('notesSearch'),notesList=document.getElementById('notesList'),notesAll=document.getElementById('notesAll');
notesBtn.onclick=e=>{e.stopPropagation();notesPanel.style.display=notesPanel.style.display==='flex'?'none':'flex'};document.addEventListener('click',e=>{if(!document.getElementById('notesDD').contains(e.target))notesPanel.style.display='none'});notesSearch.oninput=()=>renderNotesList(notesSearch.value.toLowerCase().trim());notesAll.onchange=()=>{if(notesAll.checked){selNotes.clear();renderNotesList();updateNotesLabel();showN=25;render()}else notesAll.checked=true};
function renderNotesList(filter=''){const f=allNotes.filter(n=>!filter||n.toLowerCase().includes(filter));notesList.innerHTML=f.map(n=>`<label class="nrow"><input type="checkbox" data-n="${n}" ${selNotes.has(n)?'checked':''}> ${n}</label>`).join('');notesList.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{cb.checked?selNotes.add(cb.dataset.n):selNotes.delete(cb.dataset.n);notesAll.checked=selNotes.size===0;updateNotesLabel();showN=25;render()})}
function updateNotesLabel(){notesBtn.textContent=selNotes.size===0?'Semua Notes ▾':selNotes.size===1?[...selNotes][0]+' ▾':selNotes.size+' notes dipilih ▾'}
async function init(){try{const bs=await db.collection('settings').doc('site').get();if(bs.exists){if(bs.data().bannerUrl)document.getElementById('banner').style.backgroundImage=`url('${bs.data().bannerUrl}')`;if(bs.data().tiktokProfile){const b=document.getElementById('tiktokBtn');b.href=bs.data().tiktokProfile;b.target='_blank'}}}catch(e){}try{const nl=await db.collection('noteLib').get();allNotes=[...new Set(nl.docs.map(d=>d.data().name))].sort()}catch(e){}renderNotesList();updateNotesLabel();try{const s=await db.collection('products').orderBy('createdAt','desc').get();all=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}const brands=[...new Set(all.map(p=>p.brand).filter(Boolean))];document.getElementById('fBrand').innerHTML='<option value="">Semua Brand</option>'+brands.map(b=>`<option>${b}</option>`).join('');render();['q','fBrand'].forEach(id=>document.getElementById(id).oninput=()=>{showN=25;render()})}
function filtered(){let q=document.getElementById('q').value.toLowerCase(),b=document.getElementById('fBrand').value;return all.filter(p=>{if(q&&!p.name.toLowerCase().includes(q))return false;if(b&&p.brand!==b)return false;if(selG.size&&!(p.gender||[]).some(g=>selG.has(g)))return false;if(selNotes.size){const pn=(p.notes||[]).map(x=>x.toLowerCase());for(let sn of selNotes)if(!pn.includes(sn.toLowerCase()))return false}return true})}
function render(){document.getElementById('listView').style.display='';document.getElementById('detail').style.display='none';const f=filtered(),g=document.getElementById('grid');document.getElementById('resultInfo').textContent=f.length+' parfum';g.innerHTML=f.length?'':`<div class="empty" style="grid-column:1/-1"><strong>Parfum tidak ditemukan</strong>Coba ubah kata pencarian atau filter yang kamu pilih.</div>`;f.slice(0,showN).forEach(p=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="photoWrap"><img src="${p.image||'https://via.placeholder.com/600'}" alt="${p.name||'Parfum'}"><div class="ratingBadge">⭐ ${avg(p)}/10</div></div><div class="in"><div class="cardName">${p.name}</div><div class="cardBrand">${p.brand||'Brand tidak dicantumkan'}</div><div class="cardBottom"><span class="pr">${rp(p.price)}</span><span class="tapHint">Lihat detail →</span></div></div>`;el.onclick=()=>openDetail(p.id);g.appendChild(el)});document.getElementById('btnMore').style.display=f.length>showN?'':'none';document.getElementById('btnLess').style.display=showN>25?'':'none'}
async function openDetail(id){const d=await db.collection('products').doc(id).get();if(!d.exists)return;const p={id:d.id,...d.data()};revShowGroup=5;rateId=id;document.getElementById('listView').style.display='none';const det=document.getElementById('detail');det.style.display='block';const vtBtn=p.vtLink?`<button class="b vtBtn" style="width:100%" onclick="openVt('${esc(p.vtLink)}')">▶ Lihat Full Review di TikTok</button>`:'';det.innerHTML=`<div class="detailTop"><button class="b backBtn" onclick="render()">← Kembali</button></div><div class="detailHero"><img class="detailPhoto" src="${p.image||'https://via.placeholder.com/600'}" alt="${p.name||'Parfum'}"><div class="detailInfo"><h2>${p.name}</h2><div class="detailBrand">${p.brand||''}</div><div class="detailScore">⭐ ${avg(p)} / 10</div><div class="detailPrice">${rp(p.price)}</div><div class="detailDesc">${p.desc||'Belum ada deskripsi untuk parfum ini.'}</div><div class="notesBox"><div class="notesTitle">Notes</div>${(p.notes||[]).length?(p.notes||[]).map(n=>`<span class="noteChip">${n}</span>`).join(''):'<small style="color:#999">Belum ada notes.</small>'}</div><div class="actionStack">${vtBtn}${p.shopee?`<a href="${p.shopee}" target="_blank" rel="noopener" style="text-decoration:none"><button class="b buyBtn" style="width:100%">🛒 Cek / Beli di Shopee</button></a>`:''}</div></div></div><div class="reviewSection"><h3>Ulasan Pengunjung</h3><div class="reviewSub">Lihat pengalaman orang lain sebelum kamu mencoba parfum ini.</div><div id="revList"></div><button class="b" id="revMore" style="background:#555;margin:8px 0">Lihat 5 grup lainnya</button><button class="b" onclick="document.getElementById('pop').style.display='flex'" style="width:100%;margin-top:10px">⭐ Beri Rating 1–10</button></div>`;loadRevs();document.getElementById('wrap').scrollTo(0,0)}
async function loadRevs(){const box=document.getElementById('revList');if(!box)return;const snap=await db.collection('products').doc(rateId).collection('reviews').orderBy('createdAt','desc').limit(100).get(),groups={};snap.docs.forEach(doc=>{const r=doc.data(),vid=r.visitorId||'legacy_'+r.name;if(!groups[vid])groups[vid]={vid,list:[]};groups[vid].list.push({id:doc.id,...r})});let arr=Object.values(groups);arr.sort((a,b)=>(b.list[0].createdAt?.toDate?.()?.getTime()||0)-(a.list[0].createdAt?.toDate?.()?.getTime()||0));box.innerHTML=arr.slice(0,revShowGroup).map(g=>{const latest=g.list[0],header=`<div style="display:flex;justify-content:space-between;gap:10px"><b>${latest.name}</b><small style="color:#999">${g.list.length} ulasan</small></div>`,items=g.list.map(r=>{const vtb=r.vtLink?` <button class="vtbtn" onclick="openVt('${esc(r.vtLink)}')">VT</button>`:'';const gn=r.name!==latest.name?` <small>(sebagai ${r.name})</small>`:'';return`<div class="rev-item"><div>⭐${r.score} • ${fmtDate(r.createdAt)}${gn}${vtb}</div><div>${r.text}</div></div>`}).join('');return`<div class="rev-group">${header}${items}</div>`}).join('')||'<p><small>Belum ada ulasan.</small></p>';const bm=document.getElementById('revMore');if(bm){bm.style.display=arr.length<=revShowGroup?'none':'';bm.onclick=()=>{revShowGroup+=5;loadRevs()}}}
window.render=render;function openVt(link){curVt=link;document.getElementById('vtLinkText').textContent=link;document.getElementById('vtPop').style.display='flex'}window.openVt=openVt;document.getElementById('vtClose').onclick=()=>document.getElementById('vtPop').style.display='none';document.getElementById('vtOpen').onclick=()=>{if(curVt)window.open(curVt,'_blank')};document.getElementById('vtCopy').onclick=async()=>{try{await navigator.clipboard.writeText(curVt);showToast('Link tercopy!','success')}catch(e){showToast('Copy manual: '+curVt,'warn')}};document.getElementById('rBack').onclick=()=>document.getElementById('pop').style.display='none';
document.getElementById('rSave').onclick=async()=>{const n=document.getElementById('rName').value.trim(),sc=Number(document.getElementById('rScore').value),t=document.getElementById('rText').value.trim(),sos=document.getElementById('rSos').value.trim(),vt=document.getElementById('rVt').value.trim();if(!n||!sc||!t)return showToast('Nama, score, ulasan wajib diisi','warn');if(!rateId)return showToast('Pilih produk dulu','warn');const vid=getVisitorId();try{const q=await db.collection('products').doc(rateId).collection('reviews').where('visitorId','==',vid).orderBy('createdAt','desc').limit(1).get();if(!q.empty){const last=q.docs[0].data(),lt=last.createdAt?.toDate?.()?.getTime()||0,diff=(Date.now()-lt)/(1000*60*60*24);if(diff<7)return showToast('Kamu sudah review produk ini. Bisa review lagi dalam '+Math.ceil(7-diff)+' hari.','warn')}await db.collection('products').doc(rateId).collection('reviews').add({name:n,sosmed:sos,score:sc,vtLink:vt,text:t,visitorId:vid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});const rs=await db.collection('products').doc(rateId).collection('reviews').get();let sum=0;rs.forEach(d=>sum+=Number(d.data().score||0));await db.collection('products').doc(rateId).update({ratingSum:sum,ratingCount:rs.size});document.getElementById('pop').style.display='none';['rName','rSos','rVt','rText'].forEach(i=>document.getElementById(i).value='');document.getElementById('rScore').value='';showToast('Review kamu berhasil tersimpan. Terima kasih!','success');openDetail(rateId)}catch(e){showToast('Gagal simpan: '+e.message,'error')}};
document.getElementById('btnMore').onclick=()=>{showN+=25;render()};document.getElementById('btnLess').onclick=()=>{showN=Math.max(25,showN-25);render();document.getElementById('wrap').scrollTo(0,0)};init();
</script>
</body>
